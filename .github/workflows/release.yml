name: Release and publish
run-name: Release ${{ inputs.request_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation id used by compatibility automation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      dsh_version: ${{ steps.version.outputs.dsh_version }}
      needed: ${{ steps.existing.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
      - name: Require main and resolve version
        id: version
        shell: bash
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          dsh_version="$(node -p "require('./compatibility.json').latestTested")"
          echo "dsh_version=$dsh_version" >> "$GITHUB_OUTPUT"
      - name: Protect immutable releases
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG is already published; immutable assets will not be replaced."
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: preflight
    if: needs.preflight.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Preserve the accepted package
        shell: bash
        run: |
          mkdir -p .candidate
          cp .artifacts/dsh-reasoning-slider-${{ needs.preflight.outputs.version }}.tgz .candidate/dsh-reasoning-slider.tgz
          test -s .candidate/dsh-reasoning-slider.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: .candidate/dsh-reasoning-slider.tgz
          if-no-files-found: error

  windows:
    needs: preflight
    if: needs.preflight.outputs.needed == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  official-acceptance:
    needs: [preflight, verify]
    if: needs.preflight.outputs.needed == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ github.sha }}
          path: .candidate
      - name: Official DSH end-to-end acceptance
        shell: powershell
        run: .\.github\scripts\accept-official-release.ps1 -PackagePath .candidate\dsh-reasoning-slider.tgz -DshVersion '${{ needs.preflight.outputs.dsh_version }}'

  release:
    needs: [preflight, verify, windows, official-acceptance]
    if: needs.preflight.outputs.needed == 'true' && needs.verify.result == 'success' && needs.windows.result == 'success' && needs.official-acceptance.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ github.sha }}
          path: .candidate
      - name: Write user-facing release notes
        shell: bash
        run: |
          cat > .candidate/release.md <<'NOTES'
          ## What's new

          - Renames the package to `dsh-reasoning-slider`; existing mode and color preferences migrate automatically.
          - Refines the cellular Energy control with separate effect and track colors for light and dark themes.
          - Supports shared palettes or model-specific palettes while keeping the compact model-aware effort contract.

          ## Install

          ```sh
          dsh plugin --profile web add dsh-reasoning-slider
          ```

          Restart DSH after installation.

          ## 中文

          - 软件包更名为 `dsh-reasoning-slider`，已有模式与配色偏好会自动迁移。
          - 能量滑块为浅色和深色界面分别提供效果色与轨道底色。
          - 支持全部模型共用配色或按模型保存，同时保持简洁且识别模型能力的强度控制。

          ```sh
          dsh plugin --profile web add dsh-reasoning-slider
          ```

          安装后请重启 DSH。
          NOTES
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" .candidate/dsh-reasoning-slider.tgz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "DSH Reasoning Slider $RELEASE_TAG" \
            --notes-file .candidate/release.md --latest

  publish-npm:
    needs: [preflight, release]
    if: always() && needs.preflight.result == 'success' && (needs.preflight.outputs.needed == 'false' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@12.0.2
      - name: Download the accepted package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          mkdir -p .release-artifact
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern dsh-reasoning-slider.tgz --dir .release-artifact
      - name: Publish or reconcile with npm
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if tarball="$(npm view "dsh-reasoning-slider@$version" dist.tarball 2>/dev/null)"; then
            curl --fail --location --silent --show-error "$tarball" --output "$RUNNER_TEMP/npm.tgz"
            if ! cmp -s .release-artifact/dsh-reasoning-slider.tgz "$RUNNER_TEMP/npm.tgz"; then
              mkdir -p "$RUNNER_TEMP/local" "$RUNNER_TEMP/remote"
              tar -xzf .release-artifact/dsh-reasoning-slider.tgz -C "$RUNNER_TEMP/local"
              tar -xzf "$RUNNER_TEMP/npm.tgz" -C "$RUNNER_TEMP/remote"
              diff -qr --strip-trailing-cr --exclude='*.map' "$RUNNER_TEMP/local/package" "$RUNNER_TEMP/remote/package"
              gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/npm.tgz#dsh-reasoning-slider.tgz" \
                --repo "$GITHUB_REPOSITORY" --clobber
            fi
          else
            npm publish .release-artifact/dsh-reasoning-slider.tgz --access public
          fi
