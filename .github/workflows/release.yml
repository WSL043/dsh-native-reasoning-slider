name: Release and publish
run-name: Release ${{ inputs.request_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation id used by compatibility automation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      dsh_version: ${{ steps.version.outputs.dsh_version }}
      needed: ${{ steps.existing.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
      - name: Require main and resolve version
        id: version
        shell: bash
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          dsh_version="$(node -p "require('./compatibility.json').latestTested")"
          echo "dsh_version=$dsh_version" >> "$GITHUB_OUTPUT"
      - name: Protect immutable releases
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG is already published; immutable assets will not be replaced."
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: preflight
    if: needs.preflight.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Preserve the accepted package
        shell: bash
        run: |
          mkdir -p .candidate
          cp .artifacts/dsh-native-reasoning-slider-${{ needs.preflight.outputs.version }}.tgz .candidate/dsh-native-reasoning-slider.tgz
          cp install.ps1 .candidate/install.ps1
          test -s .candidate/dsh-native-reasoning-slider.tgz
          test -s .candidate/install.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            .candidate/dsh-native-reasoning-slider.tgz
            .candidate/install.ps1
          if-no-files-found: error

  windows:
    needs: preflight
    if: needs.preflight.outputs.needed == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  official-acceptance:
    needs: [preflight, verify]
    if: needs.preflight.outputs.needed == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ github.sha }}
          path: .candidate
      - name: Official DSH end-to-end acceptance
        shell: powershell
        run: .\.github\scripts\accept-official-release.ps1 -PackagePath .candidate\dsh-native-reasoning-slider.tgz -DshVersion '${{ needs.preflight.outputs.dsh_version }}'

  release:
    needs: [preflight, verify, windows, official-acceptance]
    if: needs.preflight.outputs.needed == 'true' && needs.verify.result == 'success' && needs.windows.result == 'success' && needs.official-acceptance.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ github.sha }}
          path: .candidate
      - name: Write user-facing release notes
        shell: bash
        run: |
          cat > .candidate/release.md <<'NOTES'
          ## What's new

          - Adds Continuous and Reference Energy renderers: Continuous animates every advertised effort level, while Reference preserves the published Max-only timing and cell spread through an independent implementation.
          - Keeps Compact as an explicit Beta option and removes the extra thumb halo from the production control.
          - Fixes garbled non-ASCII output in the Windows installer while continuing to install through the official DSH plugin command.

          ## Install

          ```powershell
          irm 'https://github.com/WSL043/dsh-native-reasoning-slider/releases/latest/download/install.ps1' | iex
          ```

          Or use the official command:

          ```sh
          dsh plugin --profile web add dsh-native-reasoning-slider
          ```

          Restart DSH after installation.

          ## 中文

          - 新增连续与参考两种 Energy 渲染器：连续方案响应模型公布的每个档位，参考方案以独立实现保留公开版本仅在 Max 启动的时序和像素扩散。
          - 紧凑方案明确保留为 Beta，并移除正式控件中多余的滑块光晕。
          - 修复 Windows 安装助手的非 ASCII 输出乱码，安装过程仍只调用 DSH 官方插件命令。

          ```powershell
          irm 'https://github.com/WSL043/dsh-native-reasoning-slider/releases/latest/download/install.ps1' | iex
          ```

          或直接使用官方命令：

          ```sh
          dsh plugin --profile web add dsh-native-reasoning-slider
          ```

          安装后请重启 DSH。
          NOTES
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" .candidate/dsh-native-reasoning-slider.tgz .candidate/install.ps1 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TAG" \
            --notes-file .candidate/release.md --latest

  publish-npm:
    needs: [preflight, release]
    if: always() && needs.preflight.result == 'success' && (needs.preflight.outputs.needed == 'false' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@12.0.2
      - name: Download the accepted package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          mkdir -p .release-artifact
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern dsh-native-reasoning-slider.tgz --dir .release-artifact
      - name: Publish with npm Trusted Publishing
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-native-reasoning-slider@$version" version >/dev/null 2>&1; then
            echo "dsh-native-reasoning-slider@$version is already published."
          else
            npm publish .release-artifact/dsh-native-reasoning-slider.tgz --access public
          fi
