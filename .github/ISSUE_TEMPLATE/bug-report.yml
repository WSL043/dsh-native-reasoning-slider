name: Bug report
description: Report a reproducible reasoning control, appearance, installation, or update problem
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, account identifiers, private conversation text, or unredacted configuration files.

  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      description: Copy the exact installed version.
    validations:
      required: true

  - type: input
    id: dsh_version
    attributes:
      label: DSH version
      description: Copy the exact version shown by your installation.
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Display mode
      options:
        - Official
        - Native
        - Energy
        - Settings or installation
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the shortest sequence that reproduces the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Sanitized screenshots or output
      description: Add useful evidence after removing private conversation content and identifiers.

  - type: checkboxes
    id: safety
    attributes:
      label: Before submitting
      options:
        - label: I checked that this report contains no credentials, account identifiers, or private conversation text.
          required: true
